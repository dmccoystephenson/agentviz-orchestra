name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    # The scene build (web/orchestra-engine.*) is committed, so CI needs no emsdk.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
